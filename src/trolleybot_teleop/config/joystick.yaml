joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 0.8
    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.2
    require_enable_button: true
    enable_button: 4          # LB
    enable_turbo_button: 5    # RB
