<svg viewBox="0 0 1500 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#9ca3af"/>
    </marker>
  </defs>
  <style>
    .proc { fill:#fef9c3; stroke:#b45309; stroke-width:2; }
    .hi   { fill:#fef3c7; stroke:#ea580c; stroke-width:5; }
    .go   { fill:#c8f0d0; stroke:#15803d; stroke-width:2.5; }
    .gohi { fill:#c8f0d0; stroke:#15803d; stroke-width:2.5; }
    .dec  { fill:#dbeafe; stroke:#ea580c; stroke-width:5; }
    .t  { font-size:19px; fill:#111827; text-anchor:middle; }
    .tb { font-size:20px; fill:#111827; text-anchor:middle; }
    .el { font-size:18px; fill:#374151; }
    .w  { stroke:#9ca3af; stroke-width:2.4; fill:none; marker-end:url(#ah); }
    .star { font-size:24px; fill:#ea580c; font-weight:bold; }
  </style>

  <!-- ================= COLUMN 1 ================= -->
  <!-- Start -->
  <rect x="280" y="30" width="200" height="70" rx="35" class="go"/>
  <text x="380" y="72" class="tb">Start system</text>
  <path class="w" d="M380,100 V180"/>
  <text x="392" y="145" class="el">Start</text>

  <!-- AMR moves under trolley (HIGHLIGHT) -->
  <rect x="245" y="188" width="270" height="80" rx="10" class="hi"/>
  <text x="380" y="235" class="tb">AMR moves under trolley</text>
  <path class="w" d="M380,268 V348"/>
  <text x="392" y="313" class="el">Positioning</text>

  <!-- Detect trolley position (HIGHLIGHT, parallelogram) -->
  <polygon points="295,356 515,356 465,436 245,436" class="hi"/>
  <text x="380" y="388" class="tb">Detect trolley</text>
  <text x="380" y="412" class="tb">position</text>
  <path class="w" d="M380,436 V510"/>
  <text x="392" y="478" class="el">Check</text>

  <!-- AMR centered? (diamond) -->
  <polygon points="380,518 515,585 380,652 245,585" class="dec" stroke="#ea580c" stroke-width="5"/>
  <text x="380" y="592" class="tb">AMR centered?</text>

  <!-- Adjust position (HIGHLIGHT) -->
  <rect x="40" y="470" width="190" height="80" rx="10" class="hi"/>
  <text x="135" y="517" class="tb">Adjust position</text>
  <!-- Not centered: diamond left -> adjust bottom -->
  <path class="w" d="M245,585 H135 V550"/>
  <text x="142" y="578" class="el">Not centered</text>
  <!-- Recheck: adjust top -> detect left -->
  <path class="w" d="M135,470 V396 H240"/>
  <text x="150" y="430" class="el">Recheck</text>

  <!-- Centered: diamond bottom -> col 2 top -->
  <path class="w" d="M380,652 V700 H610 V45 H660"/>
  <text x="620" y="380" class="el" text-anchor="end">Centered</text>

  <!-- ================= COLUMN 2 ================= -->
  <!-- Extend arm -->
  <rect x="670" y="20" width="270" height="90" rx="10" class="proc"/>
  <text x="805" y="58" class="tb">Extend arm outward</text>
  <text x="805" y="84" class="t">&#8211; Motors extend the rails</text>
  <path class="w" d="M805,110 V180"/>
  <text x="817" y="150" class="el">Extend</text>

  <!-- Arm beyond edges -->
  <rect x="670" y="188" width="270" height="120" rx="10" class="proc"/>
  <text x="805" y="222" class="tb">Arm beyond trolley edges</text>
  <text x="805" y="248" class="t">&#8211; ToF sensors detect when the</text>
  <text x="805" y="272" class="t">arms pass the trolley edges</text>
  <path class="w" d="M805,308 V378"/>
  <text x="817" y="348" class="el">Past edges</text>

  <!-- Rotate stoppers -->
  <rect x="670" y="386" width="270" height="90" rx="10" class="proc"/>
  <text x="805" y="424" class="tb">Rotate stoppers</text>
  <text x="805" y="450" class="t">&#8211; Use servo motors</text>
  <path class="w" d="M805,476 V546"/>
  <text x="817" y="516" class="el">Rotate</text>

  <!-- Retract arm -->
  <rect x="670" y="554" width="270" height="100" rx="10" class="proc"/>
  <text x="805" y="594" class="tb">Retract arm</text>
  <text x="805" y="620" class="t">&#8211; Motors retract the rails</text>

  <!-- Retract: -> col 3 top -->
  <path class="w" d="M805,654 V700 H1040 V45 H1090"/>
  <text x="1050" y="380" class="el" text-anchor="end">Retract</text>

  <!-- ================= COLUMN 3 ================= -->
  <!-- Limit switch (parallelogram) -->
  <polygon points="1150,20 1420,20 1370,130 1100,130" class="proc"/>
  <text x="1260" y="58" class="tb">Limit switch triggered</text>
  <text x="1260" y="84" class="t">&#8211; Motors stop retracting</text>
  <path class="w" d="M1260,130 V200"/>
  <text x="1272" y="170" class="el">Secured</text>

  <!-- Move with trolley (HIGHLIGHT) -->
  <rect x="1125" y="208" width="270" height="90" rx="10" class="hi"/>
  <text x="1260" y="261" class="tb">Move with trolley</text>
  <path class="w" d="M1260,298 V368"/>
  <text x="1272" y="338" class="el">Transport</text>

  <!-- End -->
  <rect x="1160" y="376" width="200" height="70" rx="35" class="go"/>
  <text x="1260" y="418" class="tb">End</text>

  <!-- ================= LEGEND ================= -->
  <rect x="280" y="726" width="34" height="24" class="hi" rx="5"/>
  <text x="330" y="744" class="el">AMR positioning &amp; movement &#8212; my scope (drive electronics, mecanum drivetrain, encoders, wireless control)</text>
  <rect x="280" y="762" width="34" height="24" class="proc" rx="5"/>
  <text x="330" y="780" class="el">Trolley-latch sequence &#8212; teammates</text>
</svg>
