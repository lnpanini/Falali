# apriltag_ros detector config. Trolleys carry tags from the tag36h11 family.
apriltag_node:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.15          # tag edge length (m) — must match the printed tag
    max_hamming: 0
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
    # Map tag IDs to dock names used by the docking server.
    tag:
      ids: [1]
      frames: [trolley_1]
