<svg xmlns="http://www.w3.org/2000/svg" width="1123" height="794" viewBox="0 0 1123 794">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker><style>.t{font:700 27px Arial;fill:#0f172a}.s{font:14px Arial;fill:#475569}.h{font:700 15px Arial;fill:#0f172a}.p{font:13px Arial;fill:#334155}.sm{font:11px Arial;fill:#475569}.mine{stroke:#2563eb;stroke-width:3;rx:12}.team{stroke:#334155;stroke-width:2;rx:12}.l{stroke:#334155;stroke-width:2.2;fill:none;marker-end:url(#a)}.fb{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-dasharray:8 5;marker-end:url(#b)}</style></defs>
<rect width="1123" height="794" fill="#f8fafc"/><text x="52" y="48" class="t">HMW05 — Trolley-Claw System Function Diagram</text><text x="52" y="73" class="s">Overall team system operation • Blue borders identify my PCB, electronics and software contributions</text>
<rect x="55" y="112" width="190" height="78" class="team" fill="#e2e8f0"/><text x="150" y="140" text-anchor="middle" class="h">User / system command</text><text x="150" y="163" text-anchor="middle" class="p">Start arm cycle</text><path d="M245 151H292" class="l"/>
<rect x="292" y="105" width="220" height="92" class="mine" fill="#dbeafe"/><text x="402" y="136" text-anchor="middle" class="h">ESP32-S3 controller</text><text x="402" y="158" text-anchor="middle" class="p">Reads inputs • sends outputs</text><text x="402" y="178" text-anchor="middle" class="sm">Arduino / PlatformIO code</text><path d="M512 151H564" class="l"/>
<rect x="564" y="105" width="230" height="92" class="mine" fill="#dbeafe"/><text x="679" y="136" text-anchor="middle" class="h">Arm-control state machine</text><text x="679" y="158" text-anchor="middle" class="p">Homing → extending</text><text x="679" y="178" text-anchor="middle" class="p">flipping → retracting</text><path d="M794 151H846" class="l"/>
<rect x="846" y="112" width="220" height="78" class="team" fill="#dcfce7"/><text x="956" y="140" text-anchor="middle" class="h">Arm mechanism</text><text x="956" y="163" text-anchor="middle" class="p">Moves / secures trolley</text>
<rect x="82" y="290" width="250" height="105" class="mine" fill="#eff6ff"/><text x="207" y="321" text-anchor="middle" class="h">Motor drive</text><text x="207" y="345" text-anchor="middle" class="p">BTS7960 H-bridge</text><text x="207" y="367" text-anchor="middle" class="p">→ shared DC motor</text><text x="207" y="386" text-anchor="middle" class="sm">extends/retracts both arms</text>
<rect x="437" y="290" width="250" height="105" class="team" fill="#dcfce7"/><text x="562" y="321" text-anchor="middle" class="h">Mechanical transmission</text><text x="562" y="345" text-anchor="middle" class="p">Common thread / linkage</text><text x="562" y="367" text-anchor="middle" class="p">Arm extends under trolley</text><text x="562" y="386" text-anchor="middle" class="sm">both arms move together</text>
<rect x="792" y="290" width="250" height="105" class="team" fill="#dcfce7"/><text x="917" y="321" text-anchor="middle" class="h">Trolley engagement</text><text x="917" y="345" text-anchor="middle" class="p">Servo flippers rotate</text><text x="917" y="367" text-anchor="middle" class="p">Guide / lock trolley</text><text x="917" y="386" text-anchor="middle" class="sm">secure for manipulation</text>
<path d="M679 197V245H207V290" class="fb"/><path d="M207 395V442H562V395" class="l"/><path d="M687 342H792" class="l"/>
<rect x="82" y="520" width="250" height="105" class="mine" fill="#eff6ff"/><text x="207" y="551" text-anchor="middle" class="h">Position sensing</text><text x="207" y="575" text-anchor="middle" class="p">2 × VL53L0X ToF sensors</text><text x="207" y="597" text-anchor="middle" class="p">detect trolley boundary / air</text><text x="207" y="616" text-anchor="middle" class="sm">feedback to controller</text>
<rect x="437" y="520" width="250" height="105" class="mine" fill="#eff6ff"/><text x="562" y="551" text-anchor="middle" class="h">Home sensing</text><text x="562" y="575" text-anchor="middle" class="p">2 × limit switches</text><text x="562" y="597" text-anchor="middle" class="p">detect retracted position</text><text x="562" y="616" text-anchor="middle" class="sm">stop condition / safety input</text>
<rect x="792" y="520" width="250" height="105" class="team" fill="#fef3c7"/><text x="917" y="551" text-anchor="middle" class="h">Cycle complete</text><text x="917" y="575" text-anchor="middle" class="p">Motor stops at home</text><text x="917" y="597" text-anchor="middle" class="p">Waits for next command</text><path d="M207 520V450H679V197" class="fb"/><path d="M562 520V455H679V197" class="fb"/><path d="M917 520V445H562V395" class="l"/>
<rect x="55" y="690" width="1012" height="55" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="78" y="710" width="18" height="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="108" y="724" class="p">My contribution: PCB, arm electronics prototyping, and arm-control code</text><line x1="610" y1="719" x2="650" y2="719" class="fb"/><text x="663" y="724" class="p">Sensor / limit-switch feedback</text></svg>