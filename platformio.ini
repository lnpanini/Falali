; TrolleyBot — ESP32-S3 under-ride trolley-docking firmware
;
; Hexagonal (ports & adapters) architecture:
;   - lib/domain, lib/ports, lib/drive, lib/fakes : pure C++17, no Arduino  -> tested on the host
;   - lib/hal_esp32                                : Arduino adapters over popular libraries
;
; Two environments:
;   env:esp32s3  -> real firmware for the ESP32-S3-N16R8 (octal PSRAM)
;   env:native   -> desktop unit tests of the pure core (no hardware, no Arduino)
;
; NOTE: `pio pkg install` rewrites this file and STRIPS ALL COMMENTS.
; Add dependencies by editing lib_deps here by hand instead.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------------------
; Target firmware — ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB OCTAL PSRAM)
; ---------------------------------------------------------------------------
; NOTE: assumes Arduino-ESP32 core >= 3.0 (LEDC pin-based API: ledcAttach/ledcWrite(pin,...)).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The "R8" is octal PSRAM -> memory type must be qio_opi, and GPIO26-37 are reserved.
board_build.arduino.memory_type = qio_opi
; The pure domain is C++17; compile the firmware the same way it is unit-tested.
; (Arduino-ESP32 core 2.x otherwise defaults to gnu++11, which breaks aggregate init.)
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
; The production firmware is main.cpp ONLY. Every src/bench_*.cpp is a standalone
; bring-up rig with its own env, its own pin map and its own lib_deps -- compiling
; them in here pulled AS5600 into a build that does not declare it, and hid a
; genuine main.cpp breakage behind unrelated errors.
build_src_filter = +<main.cpp>
lib_deps =
    pololu/VL53L0X
    thomasfredericks/Bounce2
    bblanchon/ArduinoJson @ ^7.0.0
    ppedro74/SerialCommands
    ; br3ttb/PID            ; reserved: closed-loop wheel speed (FG) / centring strafe
; The TCA9548A I2C mux is driven with a raw 1-byte Wire channel-select — no extra library.

; ---------------------------------------------------------------------------
; Standalone ToF bring-up test (src/tof_scan.cpp only) — not the docking firmware.
;   pio run -e toftest -t upload && pio device monitor -b 115200
; ---------------------------------------------------------------------------
[env:toftest]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.wchusbserial*
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Serial -> UART0, which is wired to the CH343 USB-UART bridge port (auto-reset works).
    ; (If you flash via the S3's NATIVE USB port instead, add:
    ;   -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 )
build_src_filter = +<tof_scan.cpp>
lib_deps =
    pololu/VL53L0X

; ---------------------------------------------------------------------------
; Standalone bench check (src/bench_check.cpp only) — 2x ToF + 4 mecanum/L298N.
;   pio run -e bench -t upload && pio device monitor -e bench
; Small-scale rig to exercise the edge-sensing logic before the real drivetrain.
; ---------------------------------------------------------------------------
[env:bench]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem*
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; This board talks over the S3's NATIVE USB (usbmodem), not a CH343 UART bridge.
    ; Route Serial to the native USB-Serial-JTAG (same controller that flashes it,
    ; so the usbmodem port name stays stable across resets).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<bench_check.cpp>
lib_deps =
    pololu/VL53L0X

; ---------------------------------------------------------------------------
; BLD-120A single-motor bench bring-up (src/bench_motor.cpp only).
;   pio run -e bench_motor -t upload && pio device monitor -e bench_motor
;
; DIFFERENT BOARD from every other env here: a plain ESP32-WROOM-32D devkit,
; not the S3. That means:
;   - board = esp32dev (Xtensa LX6, 4 MB flash)
;   - NO PSRAM  -> no BOARD_HAS_PSRAM, no memory_type=qio_opi, GPIO16/17 are free
;   - NO native USB -> Serial is UART0 over the CH340 bridge (cu.wchusbserial*),
;     so do NOT define ARDUINO_USB_CDC_ON_BOOT here.
; Flashing this with the esp32s3 env produces a binary that will not boot.
;
; I2C here is GPIO21/22 — NOT the 38/39 in include/pins.h. Those are S3 pins:
; on this chip GPIO39 is input-only and GPIO38 is not bonded out.
; ---------------------------------------------------------------------------
[env:bench_motor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = /dev/cu.wchusbserial*
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
build_src_filter = +<bench_motor.cpp>
lib_deps =
    ; Console command dispatch — same library the main firmware already uses.
    ppedro74/SerialCommands
    ; AS5600 magnetic encoder on the motor output shaft, upstream of the 15:1
    ; gearbox (NOT the wheel axle) — closes the open-loop gap (this driver has
    ; no FG/ALM, so the encoder is the only speed feedback). Measured RPM is
    ; shaft RPM, 15x wheel RPM.
    robtillaart/AS5600@^0.6.7
; The pure-domain libs are irrelevant to this open-loop bench rig.
lib_ignore = hal_esp32

; ---------------------------------------------------------------------------
; Single-motor bench rig on the ESP32-S3 (src/bench_s3_motor.cpp only).
;   pio run -e bench_s3 -t upload && pio device monitor -e bench_s3
;   ...or drive it with ./teleop.py (single keypresses, no Enter).
;
; This is the tool for answering the open hardware questions: break-away point,
; true top speed, and whether 3.3 V PWM covers the driver's range.
;
; BENCH PINS, not the PCB pinout: SV=4, EN=8, BRK=9, F/R=15. On the fabricated
; Wheel Drive PCB those are I2C SDA/SCL and a ToF XSHUT — see include/pins.h.
;
; Serial goes over the CH343 USB-UART bridge (VID 1a86, enumerates as
; cu.wchusbserial* / ttyACM*), NOT the S3's native USB — so no CDC defines.
; ---------------------------------------------------------------------------
[env:bench_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_port = /dev/cu.usbmodem*
board_build.arduino.memory_type = qio_opi
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; Same DevKitC-1 as [env:bench], so route Serial the same way: to the native
    ; USB-Serial-JTAG, not UART0 on GPIO43/44. Without these, Serial goes out the
    ; board's OTHER USB-C jack (the bridge) and the console looks dead on usbmodem.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<bench_s3_motor.cpp>
; Nothing from the domain or the adapters is needed for an open-loop bench rig.
lib_deps = robtillaart/AS5600@^0.6.7
lib_ignore = hal_esp32

; ---------------------------------------------------------------------------
; Host unit tests — the pure domain core (Unity, bundled with PlatformIO)
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
; Never drag the Arduino adapters into a host build.
lib_ignore = hal_esp32
